source = ~/.cache/wal/colors-hyprland.conf
$terminal = kitty
$menu = wofi --show drun
$mainMod = SUPER

env = AQ_DRM_DEVICES,/dev/dri/intel-igpu

monitor = , preferred, auto, 1

exec-once = systemctl --user start hyprpolkitagent
exec-once = swayosd-server
exec-once = hyprpaper
exec-once = ~/.local/bin/waybar-run

input {
    kb_layout = us
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $color4
    col.inactive_border = $color8
    resize_on_border = true
}

animations {
    enabled = true
    bezier = smooth, 0.20, 0.80, 0.20, 1.0
    animation = windows, 1, 4, smooth
    animation = windowsIn, 1, 4, smooth, popin 85%
    animation = windowsOut, 1, 3, smooth, popin 85%
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 4, smooth
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# --- Aplikasi ---
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, E, exec, thunar
bind = $mainMod, H, exec, ~/.local/bin/hypr-shortcuts
bind = $mainMod, ESCAPE, exec, kitty -e btop
bind = $mainMod, W, exec, kitty -e nmtui
bind = $mainMod SHIFT, ESCAPE, exec, ~/.local/bin/killmenu
bind = $mainMod, B, exec, kitty -e bluetui
bind = $mainMod SHIFT, W, exec, ~/.local/bin/wallpaper
bind = , Print, exec, ~/.local/bin/screenshot area-copy
bind = SHIFT, Print, exec, ~/.local/bin/screenshot area-save
bind = CTRL, Print, exec, ~/.local/bin/screenshot full-save
bind = $mainMod SHIFT, S, exec, ~/.local/bin/screenshot area-copy
bind = $mainMod, P, exec, ~/.local/bin/powermenu

# --- Jendela ---
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, V, togglefloating
bind = $mainMod SHIFT, M, exit

# --- Pindah antar aplikasi ---
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev

bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP, movefocus, u
bind = $mainMod, DOWN, movefocus, d

bind = $mainMod SHIFT, LEFT, movewindow, l
bind = $mainMod SHIFT, RIGHT, movewindow, r
bind = $mainMod SHIFT, UP, movewindow, u
bind = $mainMod SHIFT, DOWN, movewindow, d

# --- Minimize / restore (script milikmu) ---
bind = SUPER, N, exec, ~/.local/bin/hypr-minimize
bind = SUPER SHIFT, N, exec, ~/.local/bin/hypr-restore

# --- Workspace 1-5 ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Mouse: geser & resize jendela ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- OSD volume & brightness ---
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Gestur touchpad
gesture = 3, horizontal, workspace
gesture = 3, down, mod: ALT, close
